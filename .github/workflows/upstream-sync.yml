name: Upstream sync

# main mirrors scala-steward-org/scala-steward and is never committed to. shuwari takes upstream
# fixes by merging main through a pull request, with a merge commit, which GitHub signs.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.SCALA_STEWARD_APP_ID }}
          private-key: ${{ secrets.SCALA_STEWARD_APP_KEY }}

      - name: Fast-forward main to upstream
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/merge-upstream" -f branch=main

      - name: Open the merge pull request
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          ahead=$(gh api "repos/${GITHUB_REPOSITORY}/compare/shuwari...main" --jq .ahead_by)
          if [[ "${ahead}" -eq 0 ]]; then
            echo "shuwari already contains main"
            exit 0
          fi
          open=$(gh pr list -R "${GITHUB_REPOSITORY}" --base shuwari --head main --state open --json number --jq length)
          if [[ "${open}" -gt 0 ]]; then
            echo "The merge pull request is already open"
            exit 0
          fi
          gh pr create -R "${GITHUB_REPOSITORY}" --base shuwari --head main \
            --title "[task] Merge upstream scala-steward" \
            --body "Upstream main is ${ahead} commit(s) ahead of shuwari. Merge with a merge commit: a squash or rebase would make every later upstream merge conflict."
